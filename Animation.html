<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            height: 400px;
            width: 400px;
            /* border:1px solid; */
            margin:100px auto;
        }
        .ball{
            height: 50px;
            width: 50px;
            /* border: 1px solid; */
            margin-left: 75px;
            margin-top: 15px;
            border-radius: 50%;
            box-shadow: 0px 0px 5px grey;
            animation: slider 8s infinite linear ;
            position: relative;
        }
        .box{
            height: 200px;
            width: 200px;
            /* border: 1px solid; */
            margin-left: 75px;
            
            box-shadow: 0px 0px 5px grey;
        }
        @keyframes slider {
            0%{
                top: 0;
                left: 0;
                background-image: linear-gradient(red,yellow,blue);
            }
            25%{
                top: 0;
                left: 200px;
                background-image: repeating-linear-gradient(red 10px,yellow 20px,blue 30px);
                
            }
            50%{
                top: 250px;
                left: 200px;
                background-image: linear-gradient(pink,blue,violet);
            }
            75%{
                top: 250px;
                left: -50px;
                background-image:url(./images/ralf1403-hiking-10374972_1920.jpg);
                background-position: center;
                background-size: cover;
                background-repeat: no-repeat;
            }
            100%{
                top: 0;
                left: -50px;
                background-image: repeating-conic-gradient(red 10deg,red 20deg,green 20deg,green 30deg,blue 30deg,blue 40deg);
            }

        }
    </style>
</head>
<body>
    <div class="parent">
    <div class="ball"></div>
    <div class="box"></div>
    </div>
</body>
</html>
