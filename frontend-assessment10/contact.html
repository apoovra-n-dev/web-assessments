<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Form</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- Custom CSS -->

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a
                href="index.html"
                class="navbar-brand">

                <i class="fa-solid fa-address-book"></i>

                Contact Manager

            </a>


            <img
                src="https://i.pravatar.cc/100?img=12"
                alt="Profile"
                class="profile-image">

        </div>

    </nav>



    <!-- FORM -->

    <main class="container py-5">

        <div class="form-card">


            <!-- FORM HEADER -->

            <div class="form-header">

                <h2 id="formTitle">

                    Add Contact

                </h2>


                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="goBack()">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back

                </button>

            </div>



            <!-- FORM -->

            <form id="contactForm">


                <!-- NAME -->

                <div class="mb-3">

                    <label
                        for="name"
                        class="form-label">

                        Name

                    </label>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter name"
                        required>

                </div>



                <!-- MOBILE -->

                <div class="mb-3">

                    <label
                        for="mobile"
                        class="form-label">

                        Mobile

                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        class="form-control"
                        placeholder="Enter mobile number"
                        required>

                </div>



                <!-- EMAIL -->

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label">

                        Email

                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter email"
                        required>

                </div>



                <!-- ADDRESS -->

                <div class="mb-3">

                    <label
                        for="address"
                        class="form-label">

                        Address

                    </label>

                    <textarea
                        id="address"
                        class="form-control"
                        rows="3"
                        placeholder="Enter address"
                        required>
                    </textarea>

                </div>


                <!-- BUTTONS -->

                <div>


                    <!-- SAVE / UPDATE -->

                    <button
                        type="submit"
                        id="saveButton"
                        class="btn btn-success">

                        <i class="fa-solid fa-floppy-disk"></i>

                        Save Contact

                    </button>



                    <!-- DELETE -->

                    <button
                        type="button"
                        id="deleteButton"
                        class="btn btn-danger d-none">

                        <i class="fa-solid fa-trash"></i>

                        Delete

                    </button>



                    <!-- CANCEL -->

                    <button
                        type="button"
                        class="btn btn-secondary"
                        onclick="goBack()">

                        <i class="fa-solid fa-xmark"></i>

                        Cancel

                    </button>


                </div>


            </form>


        </div>

    </main>


    <!-- JS FILES -->

    <script src="addContact.js"></script>

    <script src="editContact.js"></script>

    <script src="deleteContact.js"></script>

    <script src="contact.js"></script>


</body>

</html>
