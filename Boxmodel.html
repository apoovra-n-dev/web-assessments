<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        main{
            height: 100vh;
            width:100vw;
            background-color: #333;
        }
        main header nav{
            padding: 25px 40px;
            background-color: #000;
            border: 1px solid white;
        }

        main header ul li{
            display: inline-block;
        }

        main header ul li a{
            color: white;
            text-decoration: none;
            padding: 12px 18px;
            background-color: #333;
            border-radius: 8px;
            margin-left: 5px;
        }

        a:hover{
            box-shadow: 0px 0px 5px white,0px 0px 15px white,0px 0px 20px white;
            transition: all 2s;
        }

    </style>
</head>
<body>
    <main>
        <header>
            <nav>
                <ul>
                    <li><a href="">Home</a></li>
                    <li class="link"><a href="">Contact</a></li>
                    <li class="link"><a href="">About</a></li>
                </ul>
            </nav>
        </header>
    </main>
</body>
</html>
